services:
  - type: web
    name: restaurant-saas-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://menu-app-pearl.vercel.app,https://menu-6v69ebu3r-abdul-rehman-abe3.vercel.app
